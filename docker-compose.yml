services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cloudlecture_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloud_user
      POSTGRES_PASSWORD: cloud_pass
      POSTGRES_DB: lecture_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
